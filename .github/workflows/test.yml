name: Source package integrity
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  source-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Check declared package and syntax only
        run: |
          python3 -B - <<'PYCODE'
          import ast, importlib.util
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('release', 'scripts/release.py')
          release = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(release)
          manifest = release.check_sources(Path.cwd())
          for name in manifest['files']:
              if name.endswith('.py'):
                  ast.parse(Path(name).read_bytes(), filename=name)
          print('Declared sources complete; Python syntax valid. Behavior not evaluated.')
          PYCODE
