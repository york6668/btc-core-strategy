name: Docker data service contracts
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  data-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify pinned test dependency and export boundary
        run: python3 -B -m unittest discover -s tests -p test_ci_reader.py -v
      - name: Verify current source full offline regression
        run: python3 -B scripts/run_tests.py --reader test_support/ci_reader/telegram_reader
      - name: Verify Docker admission and failure diagnostics without starting a stack
        env:
          BTC_ACTUAL_READER: test_support/ci_reader/telegram_reader
        run: python3 -B -m unittest discover -s service -p 'test_*offline.py' -v
      - name: Verify current data service offline regressions
        run: PYTHONPATH=service python3 -B -m unittest discover -s service/tests -p 'test_*offline.py' -v
      - name: Prepare the pinned Python Docker image
        run: |
          python_image="$(python3 -B service/python_image.py)"
          docker pull "$python_image"
          docker image inspect "$python_image" --format '{{index .RepoDigests 0}}'
      - name: Verify current MySQL, actual CLI and MCP, recovery and business replay
        run: python3 -B scripts/ci_reader.py run
