name: Docker data service contracts
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  data-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify MySQL, actual CLI and MCP, recovery and business replay
        run: python3 -B service/check.py --docker docker
